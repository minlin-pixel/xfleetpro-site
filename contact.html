<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — X Fleet Pro</title>
    <meta name="description" content="Contact X Fleet Pro about Geotab setup, dashboards, integrations, and support." />
    <meta name="theme-color" content="#1f5fb8" />
    <link rel="icon" href="./assets/logo-mark.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="site-header" id="site-header"></header>

    <main id="main">
      <section class="page-intro">
        <div class="container">
          <p class="kicker">Contact</p>
          <h1>Tell us about your fleet</h1>
          <p>Share a few details and we’ll reply with next steps. Prefer email? <a href="mailto:hello@xfleetpro.com">hello@xfleetpro.com</a></p>
        </div>
      </section>

      <section class="section">
        <div class="container narrow">
          <div class="form-panel">
            <h2>Send a message</h2>
            <p>We’ll typically reply within one business day.</p>
            <form class="form" id="contactForm">
              <label>
                <span>Name</span>
                <input name="name" type="text" autocomplete="name" required />
              </label>
              <label>
                <span>Work email</span>
                <input name="email" type="email" autocomplete="email" required />
              </label>
              <label>
                <span>Fleet size</span>
                <select name="fleetSize" required>
                  <option value="" selected disabled>Select…</option>
                  <option>1–25</option>
                  <option>26–100</option>
                  <option>101–500</option>
                  <option>500+</option>
                </select>
              </label>
              <label>
                <span>What do you need help with?</span>
                <textarea name="message" rows="4" required placeholder="Geotab setup, dashboards, integrations…"></textarea>
              </label>
              <button class="btn btn-primary" type="submit">Send</button>
              <p class="note">This opens your email app with the message filled in.</p>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer" id="site-footer"></footer>
    <script src="./script.js"></script>
  </body>
</html>
